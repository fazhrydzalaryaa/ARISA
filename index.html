<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARISA - Augmented Reality Isyarat Anak</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #f5f0eb; }
    #splash { position:fixed;inset:0;z-index:9999;background:#e8f5e9;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-icon { font-size: 80px; margin-bottom: 8px; animation: float 2s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-10px) } }
    .splash-title { font-size: 42px; font-weight: 900; color: #2e7d32; letter-spacing: 4px; margin-bottom: 4px; }
    .splash-sub { font-size: 14px; color: #558b2f; font-weight: 500; letter-spacing: 1px; }
    .splash-loading { margin-top: 40px; font-size: 13px; color: #81c784; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .4 } 50% { opacity: 1 } }
    #welcome { position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#e8f5e9,#c8e6c9,#a5d6a7);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;transition:opacity .4s,transform .4s; }
    #welcome.hidden { opacity:0;transform:scale(1.05);pointer-events:none; }
    .welcome-icon { font-size:64px;margin-bottom:20px; }
    .welcome-title { font-size:28px;font-weight:800;color:#1b5e20;margin-bottom:6px; }
    .welcome-sub { font-size:15px;color:#2e7d32;font-weight:500;margin-bottom:40px; }
    .welcome-btn { background:#2e7d32;color:#fff;border:none;padding:16px 48px;border-radius:50px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 6px 20px rgba(46,125,50,.35); }
    .welcome-btn:active { transform:scale(.95); }
    #ar-container { position:fixed;inset:0;z-index:1; }
    .a-enter-vr, .a-enter-ar { display:none !important; }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-icon">🌿</div>
    <div class="splash-title">ARISA</div>
    <div class="splash-sub">Augmented Reality Isyarat Anak</div>
    <div class="splash-loading">Loading...</div>
  </div>

  <div id="welcome">
    <div class="welcome-icon">🌿</div>
    <div class="welcome-title">Belajar BISINDO</div>
    <div class="welcome-sub">Halo, Teman!</div>
    <button class="welcome-btn" id="btn-mulai">Mulai Belajar</button>
  </div>

  <div id="ar-container">
    <a-scene id="ar-scene"
      mindar-image="imageTargetSrc: ./assets/target/targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
      embedded color-space="sRGB" renderer="colorManagement: true; antialias: true;"
      vr-mode-ui="enabled: false" loading-screen="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- MARKER 0 — BUKU -->
      <a-entity id="marker-0" mindar-image="targetIndex: 0">
        <a-entity position="0 0 0" scale="0.8 0.8 0.8"
          gltf-model="./assets/models/Buku.glb"
          animation="property: rotation; to: 0 360 0; dur: 8000; loop: true">
        </a-entity>
      </a-entity>

      <!-- MARKER 1 — APEL -->
      <a-entity id="marker-1" mindar-image="targetIndex: 1">
        <a-entity position="0 0 0" scale="0.8 0.8 0.8"
          gltf-model="./assets/models/Apel.glb"
          animation="property: rotation; to: 0 360 0; dur: 8000; loop: true">
        </a-entity>
      </a-entity>

      <!-- MARKER 2 — PISANG -->
      <a-entity id="marker-2" mindar-image="targetIndex: 2">
        <a-entity position="0 0 0" scale="0.8 0.8 0.8"
          gltf-model="./assets/models/Pisang.glb"
          animation="property: rotation; to: 0 360 0; dur: 8000; loop: true">
        </a-entity>
      </a-entity>

      <a-light type="ambient" color="#fff" intensity="0.7"></a-light>
      <a-light type="directional" color="#fff" intensity="0.5" position="1 1 1"></a-light>
    </a-scene>
  </div>

  <script>
    (function() {
      var elSplash = document.getElementById('splash');
      var elWelcome = document.getElementById('welcome');

      // Splash → Welcome
      setTimeout(function() {
        elSplash.classList.add('hidden');
        setTimeout(function() { elSplash.style.display = 'none'; }, 500);
      }, 1500);

      // Welcome → Start AR
      document.getElementById('btn-mulai').addEventListener('click', function() {
        elWelcome.classList.add('hidden');
        setTimeout(function() { elWelcome.style.display = 'none'; }, 400);

        var scene = document.getElementById('ar-scene');
        if (!scene) return;

        // Start MindAR
        scene.addEventListener('arReady', function() {
          console.log('🎯 AR Ready!');
          document.getElementById('ar-container').style.background = 'transparent';
        });

        scene.addEventListener('arError', function(e) {
          console.error('❌ AR Error:', e.detail || 'unknown');
        });

        // Trigger start
        scene.setAttribute('mindar-image', { autoStart: true });
      });
    })();
  </script>
</body>
</html>
